version: 2

models:
  - name: customers
    description: One row per customer, cleaned. Source - stage.customers.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: company_name
        data_tests: [not_null]

  - name: products
    description: One row per product, typed. Source - stage.products.
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: product_name
        data_tests: [not_null]
      - name: unit_price
        data_tests: [not_null]

  - name: sales
    description: One row per order line (order_id, product_id), typed, with calculated amounts.
    data_tests:
      - unique_combination:
          combination_of_columns: [order_id, product_id]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('products')
              field: product_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id
      - name: order_date
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: net_amount
        data_tests: [not_null]
